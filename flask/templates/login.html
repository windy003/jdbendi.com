<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='180x180.png') }}">
    <title>用户登录 - 建德本地信息发布</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1976d2 0%, #0d47a1 100%);
            min-height: 100vh;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
        }

        .login-box {
            background: white;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #999;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .message.show {
            display: block;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .login-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .login-tabs button { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: #f7f7f7; cursor: pointer; }
        .login-tabs button.active { color: white; background: #667eea; border-color: #667eea; }
        .code-row { display: flex; gap: 8px; }
        .code-row input { flex: 1; min-width: 0; }
        .code-row button { padding: 0 10px; border: 1px solid #667eea; color: #667eea; background: white; border-radius: 8px; white-space: nowrap; cursor: pointer; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>用户登录</h1>
                <p>登录后可发布和管理信息</p>
            </div>

            <div class="login-tabs">
                <button type="button" class="active" data-mode="sms">手机号验证码</button>
                <button type="button" data-mode="password">用户名密码</button>
            </div>

            <form id="smsLoginForm">
                <div class="form-group">
                    <label for="phone">手机号</label>
                    <input type="text" id="phone" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="请输入手机号" required>
                </div>
                <div class="form-group">
                    <label for="smsCode">短信验证码</label>
                    <div class="code-row">
                        <input type="text" id="smsCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="4-6位验证码" required>
                        <button type="button" id="sendCodeBtn">获取验证码</button>
                    </div>
                </div>
                <button type="submit" class="btn" id="smsLoginBtn">验证码登录</button>
            </form>

            <form id="loginForm" hidden>
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn" id="loginBtn">登录</button>

            </form>
            <div id="message" class="message"></div>

            <div class="links">
                没有账号？<a href="/register">立即注册</a>
                <br><br>
                <a href="/">返回首页</a>
                 |
                <a href="/admin">管理员登录</a>
            </div>
        </div>
    </div>

    <script>
        const tabs = document.querySelectorAll('.login-tabs button');
        tabs.forEach(tab => tab.addEventListener('click', () => {
            tabs.forEach(item => item.classList.toggle('active', item === tab));
            document.getElementById('smsLoginForm').hidden = tab.dataset.mode !== 'sms';
            document.getElementById('loginForm').hidden = tab.dataset.mode !== 'password';
            document.getElementById('message').className = 'message';
        }));

        document.getElementById('sendCodeBtn').addEventListener('click', async function() {
            const phone = document.getElementById('phone').value.trim();
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showMessage('请输入有效的中国大陆手机号', 'error');
                return;
            }
            const button = this;
            button.disabled = true;
            try {
                const response = await fetch('/api/login/send-code', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({phone})
                });
                const result = await response.json();
                if (!result.success) throw new Error(result.message || '发送失败');
                showMessage(result.message, 'success');
                let remaining = 60;
                button.textContent = `${remaining}秒后重试`;
                const timer = setInterval(() => {
                    remaining--;
                    if (remaining <= 0) {
                        clearInterval(timer);
                        button.disabled = false;
                        button.textContent = '获取验证码';
                    } else button.textContent = `${remaining}秒后重试`;
                }, 1000);
            } catch (error) {
                showMessage(error.message || '短信发送失败，请稍后重试', 'error');
                button.disabled = false;
            }
        });

        document.getElementById('smsLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const button = document.getElementById('smsLoginBtn');
            button.disabled = true;
            try {
                const response = await fetch('/api/login/sms', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        phone: document.getElementById('phone').value.trim(),
                        code: document.getElementById('smsCode').value.trim()
                    })
                });
                const result = await response.json();
                if (!result.success) throw new Error(result.message || '登录失败');
                showMessage('登录成功！正在跳转...', 'success');
                setTimeout(() => window.location.href = result.user.role === 'admin' ? '/admin' : '/user_center', 700);
            } catch (error) {
                showMessage(error.message || '网络错误，请稍后重试', 'error');
                button.disabled = false;
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            if (!username || !password) {
                showMessage('请输入用户名和密码', 'error');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('登录成功！正在跳转...', 'success');
                    setTimeout(() => {
                        // 根据角色跳转
                        if (result.user.role === 'admin') {
                            window.location.href = '/admin';
                        } else {
                            window.location.href = '/user_center';
                        }
                    }, 1000);
                } else {
                    showMessage(result.message || '登录失败', 'error');
                    loginBtn.disabled = false;
                    loginBtn.textContent = '登录';
                }
            } catch (error) {
                showMessage('网络错误，请稍后重试', 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
            }
        });

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type + ' show';
        }
    </script>
</body>
</html>
